<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Metalófono – Repertorio</title>
<style>
  :root { --fg:#000; --bg:#fff; --izq:#90EE90; --der:#FF6B00; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Georgia,"Times New Roman",serif; }
  body { display:flex; flex-direction:column; height:100vh; height:100dvh; min-height:100%; overflow-x:hidden; }

  .controls { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; padding:4px 6px; border-bottom:2px solid var(--fg); background:var(--bg); }
  .group { display:flex; gap:6px; align-items:center; }
  .grow { flex:1 1 180px; min-width:0; }
  .full { flex:1 1 100%; }

  button, select { font:inherit; font-size:14px; min-height:36px; padding:4px 10px; background:var(--bg); color:var(--fg);
    border:2px solid var(--fg); border-radius:6px; cursor:pointer; touch-action:manipulation; }
  button:active { background:#ddd; }
  button.on { background:var(--fg); color:var(--bg); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--fg); outline-offset:1px; }
  select { width:100%; text-overflow:ellipsis; }

  .sw { display:inline-block; width:12px; height:12px; border:2px solid currentColor; vertical-align:-1px; margin-right:3px; }
  .sw.izq { background:var(--izq); }
  .sw.der { background:var(--der); }

  .lbl { font-style:italic; white-space:nowrap; font-size:13px; }
  input[type=range] { flex:1; min-width:0; height:28px; accent-color:#000; cursor:pointer; margin:0; }
  #speedv { min-width:4ch; text-align:right; font-variant-numeric:tabular-nums; font-weight:bold; font-size:13px; }
  #time { font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:7.5ch; }

  #hands { flex:1 1 260px; }
  #hands button { flex:1; padding:4px 4px; font-size:13px; }
  #play { min-width:90px; }
  #fs { background:#f0f0f0; }

  #status { padding:3px 8px; font-size:12px; border-bottom:1px solid var(--fg); min-height:22px; line-height:1.2; font-weight:bold; }
  #stage { flex:1; min-height:200px; position:relative; width:100%; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; background:var(--bg); touch-action:manipulation; }

  @media (max-width:600px) {
    .controls { gap:4px; padding:4px; }
    #play, #stop, #fs { flex:1; padding:4px 6px; }
    #transport { flex:1 1 100%; }
  }
  @media (max-height:500px) and (orientation:landscape) {
    body { min-height:0; }
    button, select { min-height:32px; padding:2px 6px; font-size:13px; }
    .controls { padding:2px 4px; gap:4px 6px; }
    #status { padding:2px 6px; font-size:11px; min-height:18px; }
  }
</style>
</head>
<body>
<div class="controls">
  <div class="group grow" style="flex-basis:100%">
    <select id="song" aria-label="Elegir canción"></select>
  </div>

  <div class="group" id="transport">
    <button id="play">Iniciar</button>
    <button id="stop">Reiniciar</button>
    <button id="fs" title="Pantalla completa">⛶ Pantalla completa</button>
  </div>

  <div class="group grow">
    <label class="lbl" for="speed">Velocidad</label>
    <input type="range" id="speed" min="50" max="200" step="5" value="100" aria-label="Velocidad">
    <output id="speedv" for="speed">100%</output>
  </div>

  <div class="group" id="hands" role="group" aria-label="Manos">
    <button data-view="L"><span class="sw izq"></span>Solo izquierda</button>
    <button data-view="R"><span class="sw der"></span>Solo derecha</button>
    <button data-view="both" class="on">Ambas manos</button>
  </div>

  <div class="group full">
    <span id="time">0:00 / 0:00</span>
    <input type="range" id="seek" min="0" max="1" step="any" value="0" aria-label="Posición en la canción">
  </div>
</div>

<div id="status">Iniciando catálogo…</div>
<div id="stage"><canvas id="cv"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script>
/* =====================================================================
   REPERTORIO
   ===================================================================== */
const REPERTORIO = [
  { 
    nombre: "El Peral", 
    izquierda: "./midis/Glockenspiel2.mid", 
    derecha: "./midis/Glockenspiel1.mid" 
  }
];

const $ = id => document.getElementById(id);

/* ============ 1. Teclado fijo: naturales + Sib ============ */
const KEYS = [
  { label: "Do",   midi: 72, eng: "C" }, 
  { label: "Re",  midi: 74, eng: "D" }, 
  { label: "Mi",  midi: 76, eng: "E" },
  { label: "Fa",   midi: 77, eng: "F" }, 
  { label: "Sol", midi: 79, eng: "G" }, 
  { label: "La",  midi: 81, eng: "A" },
  { label: "Sib",  midi: 82, acc: true, eng: "Bb" },
  { label: "Do’",  midi: 84, eng: "C" }, 
  { label: "Re’", midi: 86, eng: "D" }, 
  { label: "Mi’", midi: 88, eng: "E" }, 
  { label: "Fa’", midi: 89, eng: "F" }
];
const NK = KEYS.length;
const BY_MIDI = {};
KEYS.forEach((k, i) => { BY_MIDI[k.midi] = i; });
const COLOR = { L: "#90EE90", R: "#FF6B00" };
const LETTER = { L: "I", R: "D" };

let curShift = 0;
function lookup(midi) {
  let p = midi + curShift;
  while (p < 72) p += 12;
  while (p > 89) p -= 12;
  if (BY_MIDI[p] !== undefined) return BY_MIDI[p];
  let best = 0, bd = 99;
  KEYS.forEach((k, i) => { const d = Math.abs(k.midi - p); if (d < bd) { bd = d; best = i; } });
  return best;
}

/* ============ 2. Audio ============ */
const panR = new Tone.Panner(0.35).toDestination();
const panL = new Tone.Panner(-0.35).toDestination();
const synthR = new Tone.PolySynth(Tone.FMSynth, {
  harmonicity: 4.07, modulationIndex: 7, oscillator: { type: "sine" },
  envelope: { attack: 0.001, decay: 1.6, sustain: 0, release: 1.2 },
  modulation: { type: "sine" },
  modulationEnvelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.2 }
}).connect(panR);
synthR.volume.value = -12;

const synthL = new Tone.PolySynth(Tone.FMSynth, {
  harmonicity: 2, modulationIndex: 1.6, oscillator: { type: "triangle" },
  envelope: { attack: 0.004, decay: 1.1, sustain: 0, release: 0.9 },
  modulation: { type: "sine" },
  modulationEnvelope: { attack: 0.002, decay: 0.12, sustain: 0, release: 0.1 }
}).connect(panL);
synthL.volume.value = -6;

const synths = { L: synthL, R: synthR };
const click = new Tone.MembraneSynth({
  pitchDecay: 0.008, octaves: 2,
  envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.01 }
}).toDestination();
click.volume.value = -10;

/* ============ 3. Estado de la pieza ============ */
let speed = 1, view = "both", posTicks = 0, loadToken = 0;
let song = { notes: [], bpm: 100, ppq: 480, num: 4, lead: 4, endBeat: 1 };
const shown = n => view === "both" || n.hand === view;

function buildSong(raw, bpm, ppq, num, name) {
  resetPlayback();
  const T = Tone.Transport;
  T.cancel();
  T.PPQ = ppq;
  num = Math.min(Math.max(num || 4, 2), 6);

  let low = Infinity;
  raw.forEach(n => { if (n.midi < low) low = n.midi; });
  curShift = isFinite(low) ? 72 + (((low - 72) % 12) + 12) % 12 - low : 0;

  const notes = [];
  raw.slice().sort((a, b) => a.ticks - b.ticks).forEach(n => {
    const ki = lookup(n.midi);
    notes.push({
      key: ki, midi: KEYS[ki].midi, hand: n.hand, half: null,
      startBeat: n.ticks / ppq + num, durBeats: n.durationTicks / ppq,
      vel: n.velocity || 0.8, ticks: n.ticks + num * ppq, dur: n.durationTicks
    });
  });

  const seen = {};
  notes.forEach(n => { const id = n.key + "@" + n.ticks; (seen[id] = seen[id] || []).push(n); });
  Object.values(seen).forEach(g => {
    const l = g.find(n => n.hand === "L"), r = g.find(n => n.hand === "R");
    if (l && r) { l.half = "L"; r.half = "R"; }
  });

  song = { notes, bpm, ppq, num, lead: num,
    endBeat: Math.max(1, notes.reduce((m, n) => Math.max(m, n.startBeat + n.durBeats), 0) + 1.5) };

  notes.forEach(n => {
    T.schedule(time => {
      if (!shown(n)) return;
      const d = Math.max(new Tone.Ticks(n.dur).toSeconds(), 0.15);
      synths[n.hand].triggerAttackRelease(Tone.Frequency(n.midi, "midi").toFrequency(), d, time, n.vel);
    }, n.ticks + "i");
  });

  T.scheduleRepeat(time => {
    const b = Math.round(T.getTicksAtTime(time) / ppq);
    click.triggerAttackRelease(b % num === 0 ? "C3" : "G2", "32n", time);
  }, "4n");

  T.bpm.value = bpm * speed;
  $("seek").max = song.endBeat; $("seek").value = 0;
  $("status").textContent = name + " · " + Math.round(bpm) + " BPM · " + notes.length + " notas";
}

/* ============ 4. Carga de archivos ============ */
function parseMidi(buf, hand, nombre) {
  const MidiClass = (window.Midi && window.Midi.Midi) || window.Midi;
  if (!MidiClass) throw new Error("La librería Tonejs/Midi no se cargó correctamente.");
  const midi = new MidiClass(buf);
  const raw = [];
  midi.tracks.forEach(tr => {
    if (tr.instrument && tr.instrument.percussion) return;
    tr.notes.forEach(n => raw.push({ midi: n.midi, ticks: n.ticks, durationTicks: n.durationTicks, velocity: n.velocity, hand }));
  });
  return {
    raw, nombre, ppq: midi.header.ppq,
    bpm: midi.header.tempos.length ? midi.header.tempos[0].bpm : 120,
    num: midi.header.timeSignatures.length ? midi.header.timeSignatures[0].timeSignature[0] : 4
  };
}

async function fetchHand(url, hand) {
  if (!url) return null;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`No se encontró la pista (${r.status} ${r.statusText}) en ${url}`);
  return parseMidi(await r.arrayBuffer(), hand, url);
}

async function loadSong(index) {
  const item = REPERTORIO[index], token = ++loadToken;
  resetPlayback();
  $("status").textContent = "Cargando «" + item.nombre + "»…";
  try {
    const [L, R] = await Promise.all([fetchHand(item.izquierda, "L"), fetchHand(item.derecha, "R")]);
    if (token !== loadToken) return;
    const base = R || L;
    if (!base) throw new Error("La canción no tiene archivos MIDI asignados.");
    const raw = [];
    [L, R].forEach(m => {
      if (!m) return;
      const k = base.ppq / m.ppq;
      m.raw.forEach(n => raw.push({ ...n, ticks: Math.round(n.ticks * k), durationTicks: Math.max(1, Math.round(n.durationTicks * k)) }));
    });
    if (!raw.length) throw new Error("El archivo MIDI no contiene notas.");
    buildSong(raw, base.bpm, base.ppq, base.num, item.nombre);
  } catch (err) {
    if (token !== loadToken) return;
    console.error(err);
    $("status").textContent = "❌ Error al cargar «" + item.nombre + "»: " + err.message;
  }
}

const songSel = $("song");
REPERTORIO.forEach((s, i) => { const o = document.createElement("option"); o.value = i; o.textContent = s.nombre; songSel.append(o); });
songSel.addEventListener("change", () => loadSong(parseInt(songSel.value, 10)));

/* ============ 5. Controles y Pantalla Completa ============ */
const releaseAll = () => { synthL.releaseAll(); synthR.releaseAll(); };
const ticksNow = () => Tone.Transport.getTicksAtTime(Tone.getContext().currentTime);
const getBeat = () => (Tone.Transport.state === "started" ? ticksNow() : posTicks) / Tone.Transport.PPQ;

function toggleFullscreen() {
  const doc = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (doc.requestFullscreen) doc.requestFullscreen();
    else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
$("fs").addEventListener("click", toggleFullscreen);

function resetPlayback() {
  Tone.Transport.stop();
  posTicks = 0;
  releaseAll();
  $("play").textContent = "Iniciar";
  $("seek").value = 0;
}

$("play").addEventListener("click", async () => {
  await Tone.start();
  // Intenta entrar automáticamente en pantalla completa en móviles
  if (!document.fullscreenElement && !document.webkitFullscreenElement && window.innerWidth < 900) {
    try { toggleFullscreen(); } catch(e){}
  }
  const T = Tone.Transport;
  if (T.state === "started") { posTicks = ticksNow(); T.pause(); releaseAll(); $("play").textContent = "Iniciar"; }
  else {
    if (posTicks / T.PPQ >= song.endBeat - 0.01) posTicks = 0;
    T.start(undefined, Math.round(posTicks) + "i"); $("play").textContent = "Pausa";
  }
});
$("stop").addEventListener("click", resetPlayback);

$("speed").addEventListener("input", e => {
  const v = parseInt(e.target.value, 10);
  speed = v / 100;
  $("speedv").textContent = v + "%";
  Tone.Transport.bpm.value = song.bpm * speed;
});

const seek = $("seek");
let dragging = false, wasPlaying = false, lastSeek = 0;
seek.addEventListener("pointerdown", () => {
  dragging = true;
  wasPlaying = Tone.Transport.state === "started";
  if (wasPlaying) { posTicks = ticksNow(); Tone.Transport.pause(); releaseAll(); }
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (wasPlaying) { Tone.Transport.start(undefined, Math.round(posTicks) + "i"); wasPlaying = false; }
}
["pointerup", "pointercancel", "change"].forEach(ev => seek.addEventListener(ev, endDrag));
seek.addEventListener("input", () => {
  lastSeek = performance.now();
  posTicks = Math.round(parseFloat(seek.value) * Tone.Transport.PPQ);
  if (!dragging && Tone.Transport.state === "started") { Tone.Transport.ticks = posTicks; releaseAll(); }
});

$("hands").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  view = b.dataset.view;
  releaseAll();
  [...$("hands").querySelectorAll("button")].forEach(x => x.classList.toggle("on", x === b));
});

/* ============ 6. Dibujo en pantalla (Sin aire lateral) ============ */
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
let W = 300, H = 400, dpr = 1;
const G = {};

function computeGeom() {
  G.m = 2; // Margen lateral mínimo (2px) para eliminar aire a los costados
  G.laneW = (W - 2 * G.m) / NK;
  G.barArea = Math.max(70, Math.min(245, H * 0.38));
  G.top0 = H - G.barArea - Math.max(4, H * 0.01);
  G.len = i => G.barArea * (1 - 0.3 * i / (NK - 1));
  G.top = i => G.top0 - (KEYS[i].acc ? G.len(i) / 3 : 0);
  G.hit = Math.min(...KEYS.map((k, i) => k.acc ? G.top(i) : Infinity)) - Math.max(4, H * 0.01);
  G.px = Math.max(35, G.hit / 3.6);
  G.blockH = Math.max(16, Math.min(36, G.px * 0.3));
}

function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(200, Math.floor(r.width)); H = Math.max(200, Math.floor(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeGeom();
}
new ResizeObserver(resize).observe(stage);
window.addEventListener("resize", resize);
resize();

const laneX = i => G.m + i * G.laneW;
const laneCX = i => laneX(i) + G.laneW / 2;

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fitSize(text, maxW, start, weight) {
  let s = Math.round(start);
  for (; s > 7; s--) { ctx.font = weight + " " + s + "px Georgia, serif"; if (ctx.measureText(text).width <= maxW) break; }
  return s;
}

function drawLanes(beat) {
  const hy = G.hit, m = song.num;
  KEYS.forEach((k, i) => {
    const x = laneX(i);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, 0, G.laneW, hy); ctx.clip();
    if (k.acc) { ctx.fillStyle = "#f0f0f0"; ctx.fillRect(x, 0, G.laneW, hy); }
    ctx.strokeStyle = "#d4d4d4"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, hy); ctx.moveTo(x + G.laneW, 0); ctx.lineTo(x + G.laneW, hy); ctx.stroke();
    for (let b = Math.max(0, Math.floor(beat)); b <= beat + hy / G.px + 1; b++) {
      const y = hy - (b - beat) * G.px, bar = b % m === 0;
      ctx.strokeStyle = bar ? "#555" : "#cfcfcf"; ctx.lineWidth = bar ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + G.laneW, y); ctx.stroke();
    }
    ctx.restore();
  });
}

function drawBlocks(beat) {
  const hy = G.hit, showLetter = G.laneW >= 56;
  ctx.textBaseline = "middle";
  for (const n of song.notes) {
    const yb = hy - (n.startBeat - beat) * G.px;
    if (yb < -10) break;
    if (!shown(n) || yb - G.blockH > hy + 10) continue;
    ctx.save();
    ctx.beginPath(); ctx.rect(laneX(n.key), 0, G.laneW, hy); ctx.clip();
    const h = Math.min(G.blockH, Math.max(12, n.durBeats * G.px - 4));
    const half = view === "both" ? n.half : null;
    const full = G.laneW - Math.max(2, G.laneW * 0.05), w = half ? full / 2 - 1 : full;
    const x = half === "R" ? laneCX(n.key) + 1 : half === "L" ? laneCX(n.key) - 1 - w : laneCX(n.key) - w / 2;
    roundRect(x, yb - h, w, h, 5);
    ctx.fillStyle = COLOR[n.hand]; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#000"; ctx.stroke();
    if (h >= 16) {
      const yc = yb - h / 2 + 1;
      ctx.fillStyle = "#000";
      if (half) {
        if (showLetter) { ctx.textAlign = "center"; ctx.font = "bold 12px Georgia, serif"; ctx.fillText(LETTER[n.hand], x + w / 2, yc); }
      } else {
        const name = KEYS[n.key].label, pad = showLetter ? 18 : 4;
        const sz = fitSize(name, w - pad - 2, Math.min(16, h * 0.55), "bold");
        ctx.font = "bold " + sz + "px Georgia, serif";
        ctx.textAlign = "center";
        ctx.fillText(name, x + (showLetter ? (w + 12) / 2 : w / 2), yc);
        if (showLetter) { ctx.textAlign = "left"; ctx.font = "bold 10px Georgia, serif"; ctx.fillText(LETTER[n.hand], x + 5, yc); }
      }
    }
    ctx.restore();
  }
}

function drawKeyboard(beat) {
  const FLASH = 0.5;
  const lit = KEYS.map(() => ({ L: 0, R: 0 }));
  for (const n of song.notes) {
    if (n.startBeat > beat) break;
    if (!shown(n)) continue;
    const age = beat - n.startBeat;
    if (age < FLASH) lit[n.key][n.hand] = Math.max(lit[n.key][n.hand], 1 - age / FLASH);
  }
  KEYS.forEach((k, i) => {
    const h = G.len(i);
    const w = Math.min(G.laneW - 2, Math.max(16, G.laneW * 0.82));
    const x = laneCX(i) - w / 2;
    const y = G.top(i);

    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    if (k.acc) { g.addColorStop(0, "#6c7781"); g.addColorStop(0.45, "#a3adb6"); g.addColorStop(1, "#59636c"); }
    else       { g.addColorStop(0, "#c9cfd4"); g.addColorStop(0.45, "#ffffff"); g.addColorStop(1, "#b4bbc1"); }
    roundRect(x, y, w, h, 5);
    ctx.fillStyle = g; ctx.fill();

    const lv = lit[i];
    ctx.save(); roundRect(x, y, w, h, 5); ctx.clip();
    if (lv.L && lv.R) {
      ctx.globalAlpha = lv.L; ctx.fillStyle = COLOR.L; ctx.fillRect(x, y, w / 2, h);
      ctx.globalAlpha = lv.R; ctx.fillStyle = COLOR.R; ctx.fillRect(x + w / 2, y, w / 2, h);
    } else if (lv.L || lv.R) {
      ctx.globalAlpha = lv.L || lv.R; ctx.fillStyle = lv.L ? COLOR.L : COLOR.R; ctx.fillRect(x, y, w, h);
    }
    ctx.restore();

    const any = Math.max(lv.L, lv.R);
    roundRect(x, y, w, h, 5);
    ctx.lineWidth = any > 0.05 ? 3 : 1.8; ctx.strokeStyle = "#000"; ctx.stroke();

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = (k.acc && any < 0.5) ? "#fff" : "#000";

    const sz1 = fitSize(k.label, w - 2, Math.min(18, w * 0.45), "bold");
    ctx.font = "bold " + sz1 + "px Georgia, serif";
    const y1 = y + Math.max(14, h * 0.14);
    ctx.fillText(k.label, x + w / 2, y1);

    const subText = "(" + k.eng + ")";
    const sz2 = fitSize(subText, w - 2, Math.min(13, sz1 * 0.75), "normal");
    ctx.font = "normal " + sz2 + "px Georgia, serif";
    const y2 = y1 + sz1 * 0.85 + 2;
    ctx.fillText(subText, x + w / 2, y2);
  });
}
